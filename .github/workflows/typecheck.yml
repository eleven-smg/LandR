# There is no local dev machine on this project, so Vercel used to be the only
# thing that ever compiled the code -- a stray brace could sit on main until a
# deploy failed. This runs tsc on every push so mistakes surface in ~1 minute.
name: typecheck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck
